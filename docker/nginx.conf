server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:${PORT}/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # Playlist documents carry whole M3U payloads (default backend
        # limit IPTVNATOR_MAX_DOCUMENT_MB=64).
        client_max_body_size 64m;
        proxy_read_timeout 120s;
        gzip on;
        gzip_proxied any;
        gzip_types application/json;
        gzip_min_length 1024;
    }

    # Stream proxy: disable buffering so live streams flow in real-time.
    # nginx must not accumulate TS segments in memory or on disk.
    location /api/stream-proxy {
        proxy_pass http://127.0.0.1:${PORT}/stream-proxy;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Range $http_range;

        # Critical for live TV: disable all buffering so bytes flow through
        # immediately. Without this nginx accumulates the stream in memory.
        proxy_buffering off;
        proxy_cache off;

        # Long timeout for live streams that never end.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Pass through the upstream Content-Type (application/vnd.apple.mpegurl,
        # video/MP2T, video/mp4, etc.).
        proxy_pass_header Content-Type;
    }

    location /assets/app-config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
