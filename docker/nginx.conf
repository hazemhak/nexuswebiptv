server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:${PORT}/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # Playlist documents carry whole M3U payloads (default backend
        # limit IPTVNATOR_MAX_DOCUMENT_MB=64).
        client_max_body_size 64m;
        proxy_read_timeout 120s;
        gzip on;
        gzip_proxied any;
        gzip_types application/json application/x-mpegurl text/plain application/vnd.apple.mpegurl;
        gzip_min_length 1024;
    }

    # Xtream Codes API endpoints (player_api.php, get.php, xmltv.php) for IPTV Smarters, TiviMate
    location ~ ^/(player_api|get|xmltv)\.php$ {
        proxy_pass http://127.0.0.1:${PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 120s;
        gzip on;
        gzip_proxied any;
        gzip_types application/json application/x-mpegurl text/plain application/vnd.apple.mpegurl application/xml text/xml;
    }

    # Stream proxy & direct Xtream-style media stream endpoints:
    # Disable buffering so live streams, movies and series flow in real-time.
    location ~ ^/(api/)?(stream-proxy|live|movie|series)(/|$) {
        proxy_pass http://127.0.0.1:${PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Range $http_range;

        # Critical for live TV: disable all buffering so bytes flow through immediately.
        proxy_buffering off;
        proxy_cache off;

        # Long timeout for live streams that never end.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Pass through upstream Content-Type
        proxy_pass_header Content-Type;
    }

    # Root M3U export & /m3u paths for external players (IPTV Smarters, VLC)
    location ~ ^/(m3u/|playlist\.m3u|live\.m3u|movies\.m3u|series\.m3u) {
        proxy_pass http://127.0.0.1:${PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 120s;
        gzip on;
        gzip_proxied any;
        gzip_types application/json application/x-mpegurl text/plain application/vnd.apple.mpegurl;
    }

    location /assets/app-config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
