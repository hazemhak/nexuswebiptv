---
services:
  iptvnator:
    image: 4gray/iptvnator:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "4333:80"
    environment:
      BACKEND_URL: /api
      CLIENT_URL: http://localhost:4333
      PORT: "3000"
      IPTVNATOR_PROXY_ALLOW_PRIVATE_NETWORKS: "0"
      # Server storage database on the /data volume. Set to "none" to keep
      # the backend stateless.
      IPTVNATOR_STORAGE: server
      # Route all IPTV stream traffic through the server instead of the
      # user's browser. Set to "1" to enable (default: enabled in Docker).
      IPTVNATOR_STREAM_PROXY: "1"
      # Login password to protect the web app. Anyone opening the app
      # must enter this password to view channels or access the app.
      IPTVNATOR_ACCESS_TOKEN: admin123
    volumes:
      - iptvnator-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  iptvnator-data: {}
